name: SukshmaDrishti CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint, Compile & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile Backend & ML Modules
        run: |
          python -m compileall backend ml

      - name: Code Quality & Lint Check (Ruff)
        run: |
          ruff check backend ml tests

      - name: Run Pytest Suite (Unit, Integration & Security)
        env:
          APP_ENV: testing
          LOG_LEVEL: WARNING
        run: |
          pytest -q --tb=short

  docker-build:
    name: Docker Build & Container Health Validation
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            sukshmadrishti-backend:latest
            sukshmadrishti-backend:${{ github.sha }}
          load: true

      - name: Validate Container Startup & Healthcheck
        run: |
          docker run -d --name test-container -p 8000:8000 sukshmadrishti-backend:latest
          sleep 5
          docker ps
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/v1/health || exit 1
          docker logs test-container
          docker stop test-container

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

